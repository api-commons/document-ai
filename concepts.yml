context: document-ai
name: Document AI
intro: >-
  The common document-AI vocabulary -- the extraction jobs that read a document, the parsers
  or extractors that define what to read, and the fields and tables they return -- distilled
  from the APIs that already exist. Stored files belong to the files context.
tags: [Document AI, OCR, Data Extraction, Document Processing, Intelligent Document Processing, IDP, PDF, Document Parsing]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, job_id, document_id, extraction_id, request_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, submitted_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, job_status, processing_status]
  name: [title, display_name, label]

concepts:
  extraction:
    segments: [extractions, extraction, extract, parse, parses, parsing, ocr, analyze, analyses, jobs@extract|parse|ocr|documents, predictions@documents|parsers, "documents@extract|parse|parsers|extractors|ocr", recognitions]
    aliases:
      document_url: [url, file_url, document, file, input, source, input_url]
      fields: [extracted_data, data, result, results_data, entities, key_values, key_value_pairs, output, prediction]
      pages: [page_count, num_pages, pages_count]
      text: [content, markdown, full_text, raw_text, ocr_text]
      tables: [table, tables_data]
      confidence: [score, confidence_score]
      parser_id: [parser, extractor_id, extractor, model_id, model, template_id, schema_id, processor]
      completed_at: [finished_at, processed_at, done_at]
  extractor:
    requires: [extraction]
    path: /extractors
    segments: [extractors, extractor, parsers, parser, processors, processor, document_types, models@documents|ocr|extract, templates@extract|parsers|documents, schemas@extract|extraction]
    aliases:
      fields: [schema, field_definitions, json_schema, fields_to_extract, entities]
      type: [document_type, processor_type, kind, model_type]

exclude:
  extraction:
    diffbot: /analyze extracts web pages, not documents
duplicates:
  gonitro: [nitro-software]
  sensible-so: [sensible-io]

findings:
  - "An extraction agrees only on id and status. What comes back -- key-value fields, tables,
    markdown, entities, a JSON object shaped by a schema -- is each product's own model; document
    AI shares the job, not the result."
  - "Extractors (parsers, processors, document types) are a resource at only a few providers;
    most take the schema inline with each extraction request."
decisions:
  - "An extraction covers OCR, parse, extract and analyze operations, and jobs or predictions
    beneath a document or parser path."
  - "Extractors cover parsers, processors, document types and extraction templates, at
    `/extractors`."
  - "Web-page extraction (Diffbot) is not document AI and is excluded; a web-scraping context
    would own it."
  - "Duplicates merged: Nitro, Sensible."
